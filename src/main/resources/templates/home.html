<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --glass-shadow: rgba(0, 0, 0, 0.25);
            --input-bg: rgba(255, 255, 255, 0.10);
            --input-border: rgba(255, 255, 255, 0.20);
            --input-focus: rgba(255, 255, 255, 0.35);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.70);
            --text-muted: rgba(255, 255, 255, 0.45);
            --accent: #7c6fff;
            --accent-glow: rgba(124, 111, 255, 0.55);
            --btn-hover: #6457e8;
        }

        html, body {
            min-height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 45%, #24243e 100%);
            overflow-x: hidden;
        }

        /* Ambient blobs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 420px;
            height: 420px;
            top: -80px;
            right: -80px;
            background: radial-gradient(circle, rgba(124,111,255,0.35) 0%, transparent 70%);
        }
        body::after {
            width: 360px;
            height: 360px;
            bottom: -60px;
            left: -60px;
            background: radial-gradient(circle, rgba(100,200,255,0.25) 0%, transparent 70%);
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
        }

        /* Header above card */
        .page-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .page-header .logo-ring {
            width: 60px;
            height: 60px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1.5px solid var(--glass-border);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 24px var(--accent-glow);
        }

        .page-header .logo-ring svg {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: var(--accent);
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .page-header p {
            margin-top: 0.4rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Glass card */
        .glass-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            box-shadow:
                0 8px 32px var(--glass-shadow),
                inset 0 1px 0 rgba(255,255,255,0.18);
        }

        /* Form fields */
        .field-group {
            margin-bottom: 1.25rem;
        }

        .field-group label {
            display: block;
            font-size: 0.8125rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            letter-spacing: 0.01em;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap .field-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            color: var(--text-muted);
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.5rem;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 0.9375rem;
            font-family: inherit;
            outline: none;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrap input::placeholder {
            color: var(--text-muted);
            font-weight: 300;
        }

        .input-wrap input:focus {
            background: var(--input-focus);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .input-wrap input:focus + .field-icon,
        .input-wrap:focus-within .field-icon {
            color: var(--accent);
        }

        /* Move icon after input in DOM but display before */
        .input-wrap .field-icon {
            order: -1;
        }

        /* Submit button */
        .btn-register {
            margin-top: 0.5rem;
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--accent);
            color: #fff;
            font-family: inherit;
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            letter-spacing: 0.01em;
            transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .btn-register:hover {
            background: var(--btn-hover);
            box-shadow: 0 6px 28px var(--accent-glow);
            transform: translateY(-1px);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0 1.25rem;
        }

        .divider span {
            flex: 1;
            height: 1px;
            background: var(--glass-border);
        }

        .divider p {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Footer link */
        .card-footer-note {
            text-align: center;
            font-size: 0.8125rem;
            color: var(--text-muted);
        }

        .card-footer-note a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
        }

        .card-footer-note a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .glass-card {
                padding: 2rem 1.25rem;
                border-radius: 20px;
            }

            .page-header h1 {
                font-size: 1.35rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn-register {
                transition: none;
            }
        }

        /* ── Toast ── */
        #toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .toast {
            display: flex;
            align-items: flex-start;
            gap: 0.875rem;
            min-width: 300px;
            max-width: 380px;
            padding: 1rem 1.125rem;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
            pointer-events: all;
            cursor: default;

            /* entrance: slide up + fade in */
            opacity: 0;
            transform: translateY(16px) scale(0.97);
            animation: toast-in 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        .toast.toast-exit {
            animation: toast-out 0.3s cubic-bezier(0.4, 0, 1, 1) forwards;
        }

        @keyframes toast-in {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toast-out {
            to { opacity: 0; transform: translateY(8px) scale(0.96); }
        }

        /* Icon bubble */
        .toast-icon {
            flex-shrink: 0;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toast-icon.success {
            background: rgba(52, 211, 153, 0.18);
            border: 1px solid rgba(52, 211, 153, 0.35);
        }

        .toast-icon.success svg {
            width: 18px;
            height: 18px;
            stroke: #34d399;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Text */
        .toast-body {
            flex: 1;
            min-width: 0;
            padding-top: 0.1rem;
        }

        .toast-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.3;
        }

        .toast-desc {
            margin-top: 0.2rem;
            font-size: 0.78125rem;
            color: rgba(255, 255, 255, 0.60);
            line-height: 1.4;
        }

        /* Progress bar */
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            border-radius: 0 0 16px 16px;
            background: linear-gradient(90deg, #34d399, #7c6fff);
            animation: toast-progress linear forwards;
        }

        @keyframes toast-progress {
            from { width: 100%; }
            to   { width: 0%; }
        }

        .toast { position: relative; overflow: hidden; }

        /* Close button */
        .toast-close {
            flex-shrink: 0;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            color: rgba(255,255,255,0.40);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
            align-self: flex-start;
            margin-top: 1px;
        }

        .toast-close:hover {
            color: rgba(255,255,255,0.80);
            background: rgba(255,255,255,0.10);
        }

        .toast-close svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        @media (max-width: 520px) {
            #toast-container {
                bottom: 1rem;
                right: 1rem;
                left: 1rem;
            }
            .toast {
                min-width: unset;
                max-width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .toast, .toast-progress { animation: none; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>

<div class="page-wrapper">

    <header class="page-header">
        <div class="logo-ring">
            <!-- Graduation cap icon -->
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 3L2 8l10 5 10-5-10-5z"/>
                <path d="M2 8v6"/>
                <path d="M6 10.5v5a6 6 0 0 0 12 0v-5"/>
            </svg>
        </div>
        <h1>Student Registration</h1>
        <p>Create your academic profile to get started</p>
    </header>

    <div class="glass-card">
        <form th:action="@{/save}" th:object="${student}" method="post" autocomplete="off">

            <div class="field-group">
                <label for="name">Full Name</label>
                <div class="input-wrap">
                    <input
                        type="text"
                        id="name"
                        th:field="*{name}"
                        placeholder="e.g. Amara Okonkwo"
                        required
                        autocomplete="name"
                    >
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                    </svg>
                </div>
            </div>

            <div class="field-group">
                <label for="email">Email Address</label>
                <div class="input-wrap">
                    <input
                        type="email"
                        id="email"
                        th:field="*{email}"
                        placeholder="you@university.edu"
                        required
                        autocomplete="email"
                    >
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M3 7l9 6 9-6"/>
                    </svg>
                </div>
            </div>

            <div class="field-group">
                <label for="course">Course / Programme</label>
                <div class="input-wrap">
                    <input
                        type="text"
                        id="course"
                        th:field="*{course}"
                        placeholder="e.g. Computer Science"
                        required
                        autocomplete="off"
                    >
                    <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                    </svg>
                </div>
            </div>

            <button type="submit" class="btn-register">Create Account</button>

            <div class="divider">
                <span></span>
                <p>already enrolled?</p>
                <span></span>
            </div>

            <p class="card-footer-note">
                <a href="/login">Sign in to your account</a>
            </p>

        </form>
    </div>

</div>

<!-- Toast container -->
<div id="toast-container" role="region" aria-live="polite" aria-label="Notifications"></div>

<script>
  /* ── Toast system ── */
  const DURATION = 10000; // ms before auto-dismiss

  function showToast({ title, desc, type = 'success' }) {
    const container = document.getElementById('toast-container');

    const toast = document.createElement('div');
    toast.className = 'toast';
    toast.setAttribute('role', 'alert');
    toast.innerHTML = `
      <div class="toast-icon ${type}">
        <svg viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <div class="toast-body">
        <div class="toast-title">${title}</div>
        ${desc ? `<div class="toast-desc">${desc}</div>` : ''}
      </div>
      <button class="toast-close" aria-label="Dismiss">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="toast-progress" style="animation-duration: ${DURATION}ms;"></div>
    `;

    container.appendChild(toast);

    // dismiss helpers
    function dismiss() {
      toast.classList.add('toast-exit');
      toast.addEventListener('animationend', () => toast.remove(), { once: true });
    }

    const timer = setTimeout(dismiss, DURATION);

    toast.querySelector('.toast-close').addEventListener('click', () => {
      clearTimeout(timer);
      dismiss();
    });
  }

  /* ── Trigger on form submit ── */
  document.querySelector('form').addEventListener('submit', function (e) {
    // In a real Thymeleaf app, the server redirects back with a ?success param.
    // Here we intercept the submit to demo the toast, then let the form POST normally.

    // Show toast immediately
    showToast({
      title: 'Student registered successfully!',
      desc: 'The student profile has been created.',
      type: 'success',
    });

    // To demo without a backend, prevent default & reset form:
    // e.preventDefault();
    // this.reset();
    // document.getElementById('name').focus();

    // With a real backend: remove the two lines above so the form POSTs normally.
    // On redirect, detect ?registered=true in the URL and call showToast() on load:
  });

  /* ── Auto-show toast if server redirected with ?registered=true ── */
  (function () {
    const params = new URLSearchParams(window.location.search);
    if (params.get('registered') === 'true') {
      showToast({
        title: 'Student registered successfully!',
        desc: 'The student profile has been created.',
        type: 'success',
      });
      // Clean the URL so refresh doesn't re-trigger
      const clean = window.location.pathname;
      window.history.replaceState({}, '', clean);
    }
  })();
</script>

</body>
</html>
